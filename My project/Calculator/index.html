<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="calculator-display">
        <div class="display-1 experssion">
          <span></span>
        </div>
        <div class="display-2 input"><span class="cursor"></span></div>
      </div>
      <div class="calculator-btn">
        <div class="btn" data-key="clear" data-value="">C</div>
        <div class="btn" data-key="delete" data-value="">⌫</div>
        <div class="btn" data-key="operator" data-value="%">%</div>
        <div class="btn" data-key="operator" data-value="/">÷</div>
        <div class="btn" data-key="number" data-value="7">7</div>
        <div class="btn" data-key="number" data-value="8">8</div>
        <div class="btn" data-key="number" data-value="9">9</div>
        <div class="btn" data-key="operator" data-value="*">x</div>
        <div class="btn" data-key="number" data-value="4">4</div>
        <div class="btn" data-key="number" data-value="5">5</div>
        <div class="btn" data-key="number" data-value="6">6</div>
        <div class="btn" data-key="operator" data-value="-">-</div>
        <div class="btn" data-key="number" data-value="1">1</div>
        <div class="btn" data-key="number" data-value="2">2</div>
        <div class="btn" data-key="number" data-value="3">3</div>
        <div class="btn" data-key="operator" data-value="+">+</div>
        <div class="btn w-50" data-key="number" data-value="0">0</div>
        <div class="btn" data-key="dot" data-value=".">.</div>
        <div class="btn" data-key="operator" data-value="=">=</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
